[package]
name = "lanbase"
version = "0.1.0"
edition = "2024"
description = "TOML configuration and structured logging for Rust applications"
repository = "https://github.com/lanwenhong/lanbase"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[dev-dependencies]
tracing = "0.1"
humantime-serde = "1"
